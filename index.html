<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Mutabaah Ibadah</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, button, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #007bff; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- CARD 1: INPUT ANGGOTA -->
  <div class="card">
    <h2>Form Input Ibadah Anggota</h2>
    <form id="formIbadah">
      <label>Nama Anggota:</label>
      <input type="text" id="namaAnggota" placeholder="Masukkan nama Anda" required>
      
      <label>Jumlah Ibadah (Capaian):</label>
      <input type="number" id="jumlahIbadah" placeholder="Masukkan jumlah ibadah" required>
      
      <button type="button" id="btnSimpanIbadah">Simpan Ibadah</button>
    </form>
  </div>

  <!-- CARD 2: LOGIN USTADZ -->
  <div class="card" id="loginUstadzSection">
    <h2>Akses Dashboard Ustadz</h2>
    <input type="password" id="inputPinUstadz" placeholder="Masukkan PIN Ustadz (Default: 123456)">
    <button type="button" id="btnMasukUstadz" style="background-color: #007bff;">Masuk Dashboard</button>
  </div>

  <!-- CARD 3: DASHBOARD REKAP USTADZ -->
  <div class="card hidden" id="dashboardUstadzSection">
    <h2>Dashboard Rekap Ustadz</h2>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Anggota</th>
          <th>Jumlah Ibadah</th>
        </tr>
      </thead>
      <tbody id="tabelIbadahBody">
        <tr><td colspan="3">Memuat data dari Firebase...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- FIREBASE INTEGRATION SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjy_3FtYnxqfCPznmc9dRQ3ONQomBd_TU",
      authDomain: "uwaisysultan-app.firebaseapp.com",
      projectId: "uwaisysultan-app",
      storageBucket: "uwaisysultan-app.firebasestorage.app",
      messagingSenderId: "506156702952",
      appId: "1:506156702952:web:f0531bcc4dc6dc78767d5d",
      measurementId: "G-JZ8L9JLN06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PIN_USTADZ = "123456";

    // Event Listener Tombol Simpan Anggota
    document.getElementById("btnSimpanIbadah").addEventListener("click", async () => {
      const nama = document.getElementById("namaAnggota").value.trim();
      const jumlah = document.getElementById("jumlahIbadah").value;

      if (!nama || !jumlah) {
        alert("Mohon isi nama dan jumlah ibadah!");
        return;
      }

      try {
        await addDoc(collection(db, "mutabaah_ibadah"), {
          nama: nama,
          jumlahIbadah: parseInt(jumlah),
          waktu: serverTimestamp()
        });
        alert("Alhamdulillah, data ibadah berhasil disimpan!");
        document.getElementById("formIbadah").reset();
      } catch (e) {
        console.error(e);
        alert("Gagal menyimpan data ke Firebase.");
      }
    });

    // Event Listener Login Ustadz
    document.getElementById("btnMasukUstadz").addEventListener("click", () => {
      const pin = document.getElementById("inputPinUstadz").value;
      if (pin === PIN_USTADZ) {
        alert("Login Ustadz Berhasil!");
        document.getElementById("loginUstadzSection").classList.add("hidden");
        document.getElementById("dashboardUstadzSection").classList.remove("hidden");
        muatDataUstadz();
      } else {
        alert("PIN Ustadz Salah!");
      }
    });

    // Realtime Load Data Ustadz
    function muatDataUstadz() {
      const tbody = document.getElementById("tabelIbadahBody");
      onSnapshot(collection(db, "mutabaah_ibadah"), (snapshot) => {
        tbody.innerHTML = "";
        if (snapshot.empty) {
          tbody.innerHTML = "<tr><td colspan='3'>Belum ada data ibadah yang diisi.</td></tr>";
          return;
        }
        let no = 1;
        snapshot.forEach((doc) => {
          const data = doc.data();
          tbody.innerHTML += `
            <tr>
              <td>${no++}</td>
              <td>${data.nama || "-"}</td>
              <td>${data.jumlahIbadah || 0}</td>
            </tr>
          `;
        });
      });
    }
  </script>
</body>
</html>
