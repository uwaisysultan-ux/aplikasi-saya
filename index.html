<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Tarbiyah Zatiyah</title>
<style>
:root{color-scheme:light;--bg:#f2f6f4;--sf:#fff;--tx:#14231f;--mu:#5d716a;--ln:#d6e2dd;--ac:#1d7a69;--ac2:#0f4d42;--ok:#e3f2ed;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a17;--sf:#162723;--tx:#e6f1ed;--mu:#97aea6;--ln:#27403a;--ac:#4fc3a8;--ac2:#9be0cf;--ok:#1b3a33;--bt:#06201a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a17;--sf:#162723;--tx:#e6f1ed;--mu:#97aea6;--ln:#27403a;--ac:#4fc3a8;--ac2:#9be0cf;--ok:#1b3a33;--bt:#06201a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
h1{font-size:1.5rem}h2{font-size:1.1rem;margin-bottom:10px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=password],input[type=tel],select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:4px 0 12px}
textarea{min-height:80px;resize:vertical;margin-bottom:0}
label.l{font-size:.9rem;color:var(--mu)}
.btn{background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:10px 16px;font-weight:600;width:100%}
.btn.s{width:auto;padding:8px 14px}
.ic{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 12px}
.lk{background:none;border:0;color:var(--ac2);text-decoration:underline;padding:8px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.login{max-width:380px;margin:8vh auto 0;text-align:center}
.login .em{font-size:3rem;line-height:1}
.login p{color:var(--mu);margin:4px 0 20px}
.login form{text-align:left}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top small{display:block;color:var(--mu)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nav strong{flex:1;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dy{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 0;text-align:center;font-size:.8rem}
.dy b{display:block;font-size:.95rem}
.dy.sel{border-color:var(--ac);background:var(--ok)}
.dy i{font-style:normal;color:var(--mu)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font:600 2rem Georgia,serif;color:var(--ac2)}
.pb{height:8px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;background:var(--ac)}
.cat h3{margin:12px 0 6px;font-size:.92rem;color:var(--ac2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;margin-bottom:6px}
.row.done{background:var(--ok);border-color:var(--ac)}
.row label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.row .x{background:none;border:0;color:var(--mu);font-size:1.1rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem}
th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:center}
th:first-child,td:first-child{text-align:left}
td.c{font-size:.78rem}
.err{color:#c0392b;font-size:.9rem;min-height:1.3em;margin:0 0 8px}
.mu{color:var(--mu);font-size:.88rem}
.fl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.fl>*{flex:1 1 120px}.fl button{flex:0 0 auto}
.fl2{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.ctr{display:flex;align-items:center;gap:10px}.ctr b{min-width:28px;text-align:center;font-size:1.1rem}.ctr .ic{width:42px;height:42px;padding:0;font-size:1.3rem}th.c2{font-size:.75rem}.badge{font-size:.75rem;background:var(--ok);color:var(--ac2);border-radius:99px;padding:2px 8px}
</style>
</head>
<body>
<main id="app"><p class="mu">Memuat…</p></main>
<script>
(function(){
var DEF=[{id:"j1",name:"Shalat berjamaah",unit:"kali",daily:3,weekly:21,max:5},{id:"j2",name:"Shalat Dhuha",unit:"kali",daily:0,weekly:5,max:1},{id:"j3",name:"Tilawah",unit:"halaman",daily:5,weekly:35,max:100},{id:"j4",name:"Puasa Senin-Kamis",unit:"kali",daily:0,weekly:1,max:1},{id:"j5",name:"Qiyamul lail",unit:"kali",daily:0,weekly:1,max:1},{id:"j6",name:"Olahraga",unit:"kali",daily:0,weekly:1,max:1}];
var app=document.getElementById("app"),db=null,D={members:{},reports:{},cfg:{}},V={who:null,week:mon(new Date()),day:0,view:"login",err:""},LS="tz-data-v2",SS="tz-session-v2";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mon(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
var fd=new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short"}),fs=new Intl.DateTimeFormat("id-ID",{weekday:"short"});
function items(){return D.cfg.items2&&D.cfg.items2.length?D.cfg.items2:DEF}
async function hash(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tz|"+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){return"p|"+s}}
function lget(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
async function load(){
  if(db){var a=await db.collection("members").get(),b=await db.collection("reports").get(),c=await db.doc("config/main").get();
    D={members:{},reports:{},cfg:c.exists?c.data():{}};a.docs.forEach(function(d){D.members[d.id]=d.data()});b.docs.forEach(function(d){D.reports[d.id]=d.data()});return}
  var o=lget();D={members:o.members||{},reports:o.reports||{},cfg:o.cfg||{}};
  if(!Object.keys(D.members).length){var H="89a88452b45bd0072309aefd462fd0c5b5f769b50427032ce299b106391c501e";["Ayah","Ibu","Marsya","Azzahra","Uwaisy","Sultan","Aliya"].forEach(function(n,i){D.members["m"+(i+1)]={name:n,pin:H}});try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
}
async function put(kind,id,data){
  if(data===null)delete D[kind][id];else if(kind==="cfg")D.cfg=data;else D[kind][id]=data;
  try{
    if(db){var r=kind==="cfg"?db.doc("config/main"):db.collection(kind).doc(id);if(data===null)await r.delete();else await r.set(data)}
    else localStorage.setItem(LS,JSON.stringify(D))
  }catch(e){V.err="Data belum tersimpan. Periksa akses Anda.";}
}
function rid(m,w){return m+"_"+key(w)}
function rep(m,w){return D.reports[rid(m,w)]||{days:{},note:""}}
function cnt(m,w,i,id){var v=rep(m,w).days[key(add(w,i))];return v&&!Array.isArray(v)?(v[id]||0):0}
function wsum(m,w,id){var s=0;for(var i=0;i<7;i++)s+=cnt(m,w,i,id);return s}
function wpct(m,w){var l=items();return l.length?Math.round(l.reduce(function(s,x){return s+Math.min(1,wsum(m,w,x.id)/x.weekly)},0)/l.length*100):0}
function tgt(x){return(x.daily?x.daily+" "+x.unit+"/hari atau ":"")+x.weekly+" "+x.unit+"/pekan"}
function wlabel(){return fd.format(V.week)+" – "+fd.format(add(V.week,6))}
function save(){try{if(V.who)sessionStorage.setItem(SS,V.who)}catch(e){}}

function loginView(){
  var ms=Object.keys(D.members).sort(function(a,b){return D.members[a].name.localeCompare(D.members[b].name)});
  var o='<option value="">— Pilih nama —</option>'+ms.map(function(k){return'<option value="'+esc(k)+'">'+esc(D.members[k].name)+'</option>'}).join("");
  app.innerHTML='<div class="login"><div class="em">🕌</div><h1>Monitoring Tarbiyah Zatiyah</h1><p>Halaqah Pekanan</p><form class="card" id="f"><h2>Masuk ke Akun</h2><label class="l">Pilih nama</label><select id="n">'+o+'</select><label class="l">PIN (4 digit)</label><input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><p class="err">'+esc(V.err)+'</p><button class="btn">Masuk</button><button type="button" class="lk" id="u">Masuk sebagai Ustaz / Ketua</button></form></div>';
  if(!ms.length)app.querySelector(".err").textContent="Belum ada anggota. Ustaz perlu menambahkan anggota lebih dulu.";
  document.getElementById("f").onsubmit=async function(e){e.preventDefault();var id=document.getElementById("n").value,p=document.getElementById("p").value;
    if(!id||!/^\d{4}$/.test(p)){V.err="Pilih nama dan isi PIN 4 digit.";return loginView()}
    if(D.members[id].pin!==await hash(p)){V.err="PIN salah.";return loginView()}
    V.who=id;V.err="";V.view="member";save();render()};
  document.getElementById("u").onclick=function(){V.err="";V.view="ulogin";render()};
}
function ustazLogin(){
  var first=!D.cfg.pw;
  app.innerHTML='<div class="login"><div class="em">🎓</div><h1>Login Ustaz / Ketua</h1><p>'+(first?"Belum ada password. Buat password untuk pertama kali.":"Halaqah Pekanan")+'</p><form class="card" id="f"><label class="l">'+(first?"Buat password (minimal 6 karakter)":"Password")+'</label><input id="p" type="password" autocomplete="off"><p class="err">'+esc(V.err)+'</p><button class="btn">'+(first?"Simpan dan masuk":"Masuk sebagai Ustaz")+'</button><button type="button" class="lk" id="b">← Kembali</button></form></div>';
  document.getElementById("b").onclick=function(){V.err="";V.view="login";render()};
  document.getElementById("f").onsubmit=async function(e){e.preventDefault();var p=document.getElementById("p").value;
    if(first){if(p.length<6){V.err="Password minimal 6 karakter.";return ustazLogin()}await put("cfg","main",Object.assign({},D.cfg,{pw:await hash(p)}))}
    else if(D.cfg.pw!==await hash(p)){V.err="Password salah.";return ustazLogin()}
    V.who="ustaz";V.err="";V.view="ustaz";save();render()};
}
function nav(){return'<div class="nav"><button class="ic" id="pw" aria-label="Pekan sebelumnya">‹</button><strong>'+wlabel()+'</strong><button class="ic" id="nw" aria-label="Pekan berikutnya">›</button></div>'}
function bindNav(){document.getElementById("pw").onclick=function(){V.week=add(V.week,-7);render()};document.getElementById("nw").onclick=function(){V.week=add(V.week,7);render()}}
function top(t,s){return'<div class="top"><div><h1>🕌 Tarbiyah Zatiyah</h1><small>'+esc(t)+(s?' <span class="badge">'+s+'</span>':"")+'</small></div><button class="ic" id="out">Keluar ⏏</button></div>'}
function bindOut(){document.getElementById("out").onclick=function(){V.who=null;V.view="login";try{sessionStorage.removeItem(SS)}catch(e){}render()}}
function memberView(){
  var m=V.who,its=items(),w=V.week,dk=key(add(w,V.day)),wp=wpct(m,w);
  var h=top(D.members[m].name)+nav()+'<div class="card"><div class="big"><b>'+wp+'%</b><span class="mu">capaian target pekan ini</span></div><div class="pb"><i style="width:'+wp+'%"></i></div>'+its.map(function(x){var q=wsum(m,w,x.id);return'<div style="margin-top:12px"><div class="fl2"><span>'+esc(x.name)+'</span><span class="mu">'+q+' / '+x.weekly+' '+esc(x.unit)+'</span></div><div class="pb"><i style="width:'+Math.min(100,q/x.weekly*100)+'%"></i></div></div>'}).join("")+'</div><div class="days">';
  for(var i=0;i<7;i++){var d=add(w,i),a=its.some(function(x){return cnt(m,w,i,x.id)>0});h+='<button class="dy'+(i===V.day?" sel":"")+'" data-i="'+i+'"><i>'+fs.format(d)+'</i><b>'+d.getDate()+'</b><i>'+(a?"✓":"·")+'</i></button>'}
  h+='</div><div class="card"><h2>Catatan '+fs.format(add(w,V.day))+', '+fd.format(add(w,V.day))+'</h2>'+its.map(function(x){var c=cnt(m,w,V.day,x.id),ok=x.daily&&c>=x.daily;return'<div class="row'+(ok?" done":"")+'"><div style="flex:1"><div>'+esc(x.name)+'</div><div class="mu">Target '+esc(tgt(x))+'</div></div><div class="ctr"><button class="ic" data-m="'+esc(x.id)+'" aria-label="Kurangi '+esc(x.name)+'">−</button><b>'+c+'</b><button class="ic" data-p="'+esc(x.id)+'" aria-label="Tambah '+esc(x.name)+'">+</button></div></div>'}).join("")+'</div><div class="card"><h2>Muhasabah pekan ini</h2><textarea id="nt" placeholder="Apa yang sudah baik? Apa yang perlu diperbaiki?">'+esc(rep(m,w).note||"")+'</textarea></div><p class="err">'+esc(V.err)+'</p>';
  app.innerHTML=h;bindNav();bindOut();
  app.querySelectorAll(".dy").forEach(function(b){b.onclick=function(){V.day=+b.dataset.i;render()}});
  app.querySelectorAll("[data-m],[data-p]").forEach(function(b){b.onclick=async function(){
    var id=b.dataset.m||b.dataset.p,x=its.filter(function(y){return y.id===id})[0],r=rep(m,w),dd=r.days[dk];
    if(!dd||Array.isArray(dd))dd={};
    var c=(dd[id]||0)+(b.dataset.p?1:-1);if(c<0||c>x.max)return;
    dd[id]=c;r.days[dk]=dd;r.mid=m;r.week=key(w);V.err="";
    var pr=put("reports",rid(m,w),r);render();await pr;if(V.err)render()}});
  document.getElementById("nt").onchange=async function(){var x=rep(m,w);x.note=this.value;x.mid=m;x.week=key(w);await put("reports",rid(m,w),x)};
}
function ustazView(){
  var ms=Object.keys(D.members).sort(function(a,b){return D.members[a].name.localeCompare(D.members[b].name)}),w=V.week,its=items();
  var avg=ms.length?Math.round(ms.reduce(function(s,k){return s+wpct(k,w)},0)/ms.length):0;
  var h=top("Ustaz / Ketua","Ustaz")+nav()+'<div class="card"><div class="big"><b>'+avg+'%</b><span class="mu">rata-rata halaqah ('+ms.length+' anggota)</span></div><div class="pb"><i style="width:'+avg+'%"></i></div></div><div class="card"><h2>Rekap pekan</h2><div class="tw"><table><tr><th>Nama</th>'+its.map(function(x){return'<th class="c2">'+esc(x.name)+'</th>'}).join("")+'<th>Capaian</th></tr>';
  if(!ms.length)h+='<tr><td colspan="'+(its.length+2)+'" class="mu">Belum ada anggota.</td></tr>';
  ms.forEach(function(k){h+='<tr><td>'+esc(D.members[k].name)+'</td>'+its.map(function(x){var q=wsum(k,w,x.id);return'<td class="c" style="background:rgba(29,122,105,'+(Math.min(1,q/x.weekly)*0.45).toFixed(2)+')">'+q+'/'+x.weekly+'</td>'}).join("")+'<td><b>'+wpct(k,w)+'%</b></td></tr>'});
  h+='</table></div></div><div class="card"><h2>Catatan muhasabah</h2>';
  var any=false;ms.forEach(function(k){var n=rep(k,w).note;if(n){any=true;h+='<p><b>'+esc(D.members[k].name)+'</b><br><span class="mu">'+esc(n)+'</span></p>'}});
  if(!any)h+='<p class="mu">Belum ada catatan pekan ini.</p>';
  h+='</div><div class="card"><h2>Kelola anggota</h2><form class="fl" id="af"><div><label class="l">Nama</label><input id="an" type="text" style="margin-bottom:0"></div><div><label class="l">PIN 4 digit</label><input id="ap" type="tel" maxlength="4" style="margin-bottom:0"></div><button class="btn s">Tambah</button></form><p class="err">'+esc(V.err)+'</p>'+ms.map(function(k){return'<div class="row"><span style="flex:1">'+esc(D.members[k].name)+'</span><button class="ic" data-r="'+esc(k)+'">Reset PIN</button><button class="x" data-d="'+esc(k)+'" aria-label="Hapus">×</button></div>'}).join("")+'</div><div class="card"><h2>Target amal</h2>'+its.map(function(x){return'<div class="row"><span style="flex:1">'+esc(x.name)+' <span class="mu">('+esc(tgt(x))+')</span></span><button class="x" data-x="'+esc(x.id)+'" aria-label="Hapus amal">×</button></div>'}).join("")+'<form class="fl" id="if" style="margin-top:10px"><div><label class="l">Amal baru</label><input id="in" type="text" style="margin-bottom:0"></div><div><label class="l">Satuan</label><input id="iu" type="text" placeholder="kali" style="margin-bottom:0"></div><div><label class="l">Target/hari (opsional)</label><input id="id" type="tel" style="margin-bottom:0"></div><div><label class="l">Target/pekan</label><input id="iw" type="tel" style="margin-bottom:0"></div><button class="btn s">Tambah</button></form></div>';
  app.innerHTML=h;bindNav();bindOut();
  document.getElementById("af").onsubmit=async function(e){e.preventDefault();var n=document.getElementById("an").value.trim(),p=document.getElementById("ap").value;
    if(!n||!/^\d{4}$/.test(p)){V.err="Isi nama dan PIN 4 digit.";return render()}
    V.err="";await put("members","m"+Date.now(),{name:n,pin:await hash(p)});render()};
  app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){var p=prompt("PIN baru (4 digit) untuk "+D.members[b.dataset.r].name+":");if(p===null)return;if(!/^\d{4}$/.test(p)){V.err="PIN harus 4 digit angka.";return render()}V.err="";await put("members",b.dataset.r,Object.assign({},D.members[b.dataset.r],{pin:await hash(p)}));render()}});
  app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(){if(!confirm("Hapus "+D.members[b.dataset.d].name+" dari halaqah?"))return;await put("members",b.dataset.d,null);render()}});
  app.querySelectorAll("[data-x]").forEach(function(b){b.onclick=async function(){await put("cfg","main",Object.assign({},D.cfg,{items2:its.filter(function(x){return x.id!==b.dataset.x})}));render()}});
  document.getElementById("if").onsubmit=async function(e){e.preventDefault();var n=document.getElementById("in").value.trim(),dl=Math.max(0,parseInt(document.getElementById("id").value)||0),wk=parseInt(document.getElementById("iw").value)||0;
    if(!n||wk<1){V.err="Isi nama amal dan target pekanan.";return render()}
    V.err="";await put("cfg","main",Object.assign({},D.cfg,{items2:its.concat([{id:"u"+Date.now(),name:n,unit:document.getElementById("iu").value.trim()||"kali",daily:dl,weekly:wk,max:Math.max(wk,dl,1)}])}));render()};
}
function render(){
  if(V.view==="member"&&D.members[V.who])memberView();
  else if(V.view==="ustaz"&&V.who==="ustaz")ustazView();
  else if(V.view==="ulogin")ustazLogin();
  else{V.view="login";loginView()}
}
async function start(){
  try{if(window.claude&&claude.use)db=await claude.use("db")}catch(e){db=null}
  try{await load()}catch(e){db=null;await load()}
  try{var s=sessionStorage.getItem(SS);if(s==="ustaz"){V.who=s;V.view="ustaz"}else if(s&&D.members[s]){V.who=s;V.view="member"}}catch(e){}
  var t=new Date(),dow=(t.getDay()+6)%7;V.day=dow;
  render();
}
start();
})();<!-- Integration Script Firebase & PIN Ustadz -->

        document.getElementById("dashboardUstadzSection").style.display = "block";
      }
      muatDataIbadahUstadz();
    } else {
      alert("PIN Ustadz Salah! Silakan coba lagi.");
    }
  };

  // Fungsi Simpan Ibadah Anggota ke Firebase
  window.simpanIbadahAnggota = async function() {
    const nama = document.getElementById("namaAnggota") ? document.getElementById("namaAnggota").value : "";
    const jumlahIbadah = document.getElementById("jumlahIbadah") ? document.getElementById("jumlahIbadah").value : 0;

    if (!nama || !jumlahIbadah) {
      alert("Mohon isi nama dan jumlah ibadah!");
      return;
    }

    try {
      await addDoc(collection(db, "mutabaah_ibadah"), {
        nama: nama,
        jumlahIbadah: parseInt(jumlahIbadah),
        waktu: serverTimestamp()
      });
      alert("Alhamdulillah, data ibadah berhasil disimpan!");
      if(document.getElementById("formIbadah")) {
        document.getElementById("formIbadah").reset();
      }
    } catch (error) {
      console.error("Gagal menyimpan data:", error);
      alert("Gagal menyimpan data ibadah. Coba lagi!");
    }
  };

  // Fungsi Load Data Realtime ke Dashboard Ustadz
  function muatDataIbadahUstadz() {
    const tabelBody = document.getElementById("tabelIbadahBody");
    if(!tabelBody) return;

    onSnapshot(collection(db, "mutabaah_ibadah"), (snapshot) => {
      tabelBody.innerHTML = "";
      let nomor = 1;
      snapshot.forEach((doc) => {
        const data = doc.data();
        const row = `
          <tr>
            <td>${nomor++}</td>
            <td>${data.nama || "-"}</td>
            <td>${data.jumlahIbadah || 0}</td>
          </tr>
        `;
        tabelBody.innerHTML += row;
      });
    });
  }
</script>
