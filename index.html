<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.pb i{display:block;height:100%;background:var(--ac)}

th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:center}

td.c{font-size:.78rem}
.err{color:#c0392b;font-size:.9rem;min-height:1.3em;margin:0 0 8px}
.mu{color:var(--mu);font-size:.88rem}
.fl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.fl>*{flex:1 1 120px}.fl button{flex:0 0 auto}
.fl2{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.ctr{display:flex;align-items:center;gap:10px}.ctr b{min-width:28px;text-align:center;font-size:1.1rem}.ctr .ic{width:42px;height:42px;padding:0;font-size:1.3rem}th.c2{font-size:.75rem}.badge{font-size:.75rem;background:var(--ok);color:var(--ac2);border-radius:99px;padding:2px 8px}
</style>

(function(){

var app=document.getElementById("app"),db=null,fs=null,D={members:{},reports:{},cfg:{}},V={who:null,week:mon(new Date()),day:0,view:"login",err:""},LS="tz-data-v3",SS="tz-session-v3";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mon(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}

var SEED=[["Ayah","30f4874cf6ed617c71c8c5dcdbc417136663dc0a92341f5c40019d9f2fbfc610"],["Ibu","bfdd76b0f8e5a869c85855f7cfa11abcf6e72e8578d9b9a7d25da3bc72fd2dd4"],["Marsya","07fc2a36106531eaca6ec65536c11e8fc5d1d0a286e9df0af5600eb000e144e1"],["Azzahra","66cb9ba2cdd9d8cbd3ead27f6b1a8e04c291d541d1e88d8d718ea715fbdabf45"],["Uwaisy","0c5748e30d66778ee3e22f460074285f08f4806d18c0b45d2048a55b4f246f7b"],["Sultan","fd1120c5001ca5f1b535d0d664f73c606dd6b1bec99f05e6abc1204eed4b3c3c"],["Aliya","bc04b8d6df99edada1d9193b895f6363a6a519bdc0874aeaa457d71a89d28be4"]],ADMIN="b870898db249a782261064979684982f4bc563787b9fff5cc8c82ce84de8b58e";
async function seed(){
  for(var i=0;i<SEED.length;i++)await put("members","m"+(i+1),{name:SEED[i][0],pin:SEED[i][1]});
  await put("cfg","main",Object.assign({},D.cfg,{pw:ADMIN}));

async function load(){
  if(fs){var a=await fs.collection("members").get(),b=await fs.collection("reports").get(),c=await fs.doc("config/main").get();
    D={members:{},reports:{},cfg:c.exists?c.data():{}};a.forEach(function(d){D.members[d.id]=d.data()});b.forEach(function(d){D.reports[d.id]=d.data()})}

    D={members:{},reports:{},cfg:c2.exists?c2.data():{}};a2.docs.forEach(function(d){D.members[d.id]=d.data()});b2.docs.forEach(function(d){D.reports[d.id]=d.data()})}
  else{var o=lget();D={members:o.members||{},reports:o.reports||{},cfg:o.cfg||{}}}
  if(!db&&!D.cfg.pw)await seed();

async function put(kind,id,data){
  if(data===null)delete D[kind][id];else if(kind==="cfg")D.cfg=data;else D[kind][id]=data;
  try{
    var X=fs||db;
    if(X){var r=kind==="cfg"?X.doc("config/main"):X.collection(kind).doc(id);if(data===null)await r.delete();else await r.set(data)}
    else localStorage.setItem(LS,JSON.stringify(D))
  }catch(e){V.err="Data belum tersimpan. Periksa koneksi atau akses.";}
}
function rid(m,w){return m+"_"+key(w)}
function rep(m,w){return D.reports[rid(m,w)]||{days:{},note:""}}
function cnt(m,w,i,id){var v=rep(m,w).days[key(add(w,i))];return v&&!Array.isArray(v)?(v[id]||0):0}
function wsum(m,w,id){var s=0;for(var i=0;i<7;i++)s+=cnt(m,w,i,id);return s}
function wpct(m,w){var l=items();return l.length?Math.round(l.reduce(function(s,x){return s+Math.min(1,wsum(m,w,x.id)/x.weekly)},0)/l.length*100):0}
function tgt(x){return(x.daily?x.daily+" "+x.unit+"/hari atau ":"")+x.weekly+" "+x.unit+"/pekan"}
function wlabel(){return fd.format(V.week)+" – "+fd.format(add(V.week,6))}
function save(){try{if(V.who)sessionStorage.setItem(SS,V.who)}catch(e){}}

function loginView(){

  if(!ms.length)app.querySelector(".err").textContent="Belum ada anggota. Ustaz perlu menambahkan anggota lebih dulu.";
  document.getElementById("f").onsubmit=async function(e){e.preventDefault();var id=document.getElementById("n").value,p=document.getElementById("p").value;
    if(!id||!/^\d{4}$/.test(p)){V.err="Pilih nama dan isi PIN 4 digit.";return loginView()}
    if(D.members[id].pin!==await hash(p)){V.err="PIN salah.";return loginView()}
    V.who=id;V.err="";V.view="member";save();render()};

  app.innerHTML='<div class="login"><div class="em">🎓</div><h1>Login Admin / Ustaz</h1><p>'+(first?"Belum ada PIN admin. Buat PIN admin untuk pertama kali.":"Halaqah Pekanan")+'</p><form class="card" id="f"><label class="l">'+(first?"Buat PIN admin (minimal 4 karakter)":"PIN Admin")+'</label><input id="p" type="password" inputmode="numeric" autocomplete="off"><p class="err">'+esc(V.err)+'</p><button class="btn">'+(first?"Simpan dan masuk":"Masuk sebagai Ustaz")+'</button><button type="button" class="lk" id="b">← Kembali</button></form></div>';

function nav(){return'<div class="nav"><button class="ic" id="pw" aria-label="Pekan sebelumnya">‹</button><strong>'+wlabel()+'</strong><button class="ic" id="nw" aria-label="Pekan berikutnya">›</button></div>'}

  for(var i=0;i<7;i++){var d=add(w,i),a=its.some(function(x){return cnt(m,w,i,x.id)>0});h+='<button class="dy'+(i===V.day?" sel":"")+'" data-i="'+i+'"><i>'+fs.format(d)+'</i><b>'+d.getDate()+'</b><i>'+(a?"✓":"·")+'</i></button>'}
  h+='</div><div class="card"><h2>Catatan '+fs.format(add(w,V.day))+', '+fd.format(add(w,V.day))+'</h2>'+its.map(function(x){var c=cnt(m,w,V.day,x.id),ok=x.daily&&c>=x.daily;return'<div class="row'+(ok?" done":"")+'"><div style="flex:1"><div>'+esc(x.name)+'</div><div class="mu">Target '+esc(tgt(x))+'</div></div><div class="ctr"><button class="ic" data-m="'+esc(x.id)+'" aria-label="Kurangi '+esc(x.name)+'">−</button><b>'+c+'</b><button class="ic" data-p="'+esc(x.id)+'" aria-label="Tambah '+esc(x.name)+'">+</button></div></div>'}).join("")+'</div><div class="card"><h2>Muhasabah pekan ini</h2><textarea id="nt" placeholder="Apa yang sudah baik? Apa yang perlu diperbaiki?">'+esc(rep(m,w).note||"")+'</textarea></div><p class="err">'+esc(V.err)+'</p>';
  app.innerHTML=h;bindNav();bindOut();
  app.querySelectorAll(".dy").forEach(function(b){b.onclick=function(){V.day=+b.dataset.i;render()}});
  app.querySelectorAll("[data-m],[data-p]").forEach(function(b){b.onclick=async function(){

  var ms=Object.keys(D.members).sort(function(a,b){return D.members[a].name.localeCompare(D.members[b].name)}),w=V.week,its=items();

  app.innerHTML=h;bindNav();bindOut();
  document.getElementById("cp").onclick=async function(){var p=prompt("PIN admin baru (minimal 4 karakter):");if(p===null)return;if(p.length<4){V.err="PIN admin minimal 4 karakter.";return render()}V.err="";await put("cfg","main",Object.assign({},D.cfg,{pw:await hash(p)}));alert("PIN admin diperbarui.")};

  document.getElementById("if").onsubmit=async function(e){e.preventDefault();var n=document.getElementById("in").value.trim(),dl=Math.max(0,parseInt(document.getElementById("id").value)||0),wk=parseInt(document.getElementById("iw").value)||0;
    if(!n||wk<1){V.err="Isi nama amal dan target pekanan.";return render()}
    V.err="";await put("cfg","main",Object.assign({},D.cfg,{items2:its.concat([{id:"u"+Date.now(),name:n,unit:document.getElementById("iu").value.trim()||"kali",daily:dl,weekly:wk,max:Math.max(wk,dl,1)}])}));render()};
}
function render(){
  if(V.view==="member"&&D.members[V.who])memberView();
  else if(V.view==="ustaz"&&V.who==="ustaz")ustazView();
  else if(V.view==="ulogin")ustazLogin();
  else{V.view="login";loginView()}
}
async function start(){
  try{if(FIREBASE_CONFIG&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore()}else if(window.claude&&claude.use)db=await claude.use("db")}catch(e){db=null;fs=null}
  try{await load()}catch(e){db=null;fs=null;await load()}
  try{var s=sessionStorage.getItem(SS);if(s==="ustaz"){V.who=s;V.view="ustaz"}else if(s&&D.members[s]){V.who=s;V.view="member"}}catch(e){}
  var t=new Date(),dow=(t.getDay()+6)%7;V.day=dow;
  render();
}
start();
})();
</script>
